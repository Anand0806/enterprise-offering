<title>Enterprise Offering Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f9fafb; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e5e7eb; --line-2:#eef0f3;
  --accent:#4f46e5; --accent-ink:#fff; --accent-soft:#eef2ff;
  --ok:#047857; --ok-soft:#ecfdf5; --warn:#b45309; --warn-soft:#fffbeb; --bad:#b91c1c; --bad-soft:#fef2f2; --info:#0369a1; --info-soft:#f0f9ff;
  --radius:10px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:12px;align-items:center} .row.wrap{flex-wrap:wrap} .spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;overflow-x:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#818cf8,#4f46e5);display:inline-block}
.ptabs{display:flex;gap:4px}
.ptab{background:none;border:0;color:#cbd5e1;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;position:relative}
.ptab:hover{background:#1e293b;color:#fff}
.ptab.on{background:#1e293b;color:#fff;box-shadow:inset 0 -2px 0 #818cf8}
.ptab .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.top .reset{background:none;border:1px solid #334155;color:#cbd5e1;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}

/* layout */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static!important;height:auto!important;border-right:0!important;border-bottom:1px solid var(--line)}}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side .ctx{padding:8px 10px 14px;border-bottom:1px solid var(--line-2);margin-bottom:10px}
.side .ctx b{display:block;font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button[disabled]{opacity:.45;cursor:not-allowed}
.nav .badge{margin-left:auto}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
.main{padding:24px 28px 80px;min-width:0}
@media(max-width:600px){.main{padding:16px}}
.page-h{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h .sub{color:var(--muted);margin-top:4px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-b{padding:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.plain::before{display:none}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:#a7f3d0}
.c-warn{background:var(--warn-soft);color:var(--warn);border-color:#fde68a}
.c-bad{background:var(--bad-soft);color:var(--bad);border-color:#fecaca}
.c-info{background:var(--info-soft);color:var(--info);border-color:#bae6fd}
.c-acc{background:var(--accent-soft);color:var(--accent);border-color:#c7d2fe}
.badge{background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbff}
tr.sel td{background:#f5f7ff}
td.mono{white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cellname b{display:block;font-weight:600}
.cellname span{font-size:12px;color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad)}
.inp,select.inp,textarea.inp{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0}
.inp:focus{outline:2px solid #c7d2fe;border-color:var(--accent)}
.inp[readonly]{background:var(--surface-2);color:var(--muted)}
.inp.bad{border-color:var(--bad)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface)}
.fieldset legend{font-weight:600;padding:0 6px}
.lock{font-size:11px;color:var(--muted);font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.filters .inp{width:auto;min-width:140px;padding:6px 10px}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid #c7d2fe;color:var(--accent);font-weight:600}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:#fde68a;color:#78350f}
.banner.bad{background:var(--bad-soft);border-color:#fecaca;color:#7f1d1d}
.banner.info{background:var(--info-soft);border-color:#bae6fd;color:#0c4a6e}
.banner.ok{background:var(--ok-soft);border-color:#a7f3d0;color:#064e3b}
.banner .t{font-weight:600}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.dialog{position:absolute;left:50%;top:6vh;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog.wide{width:min(920px,calc(100vw - 32px))}
.dialog-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.dialog-b{padding:18px 20px;overflow:auto}
.dialog-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2)}
.x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);margin-left:auto}

/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:#0f172a;color:#f8fafc;border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;animation:in .2s ease}
.toast .link{color:#a5b4fc}
@keyframes in{from{transform:translateY(8px);opacity:0}}

/* misc */
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;font-weight:500;word-break:break-word}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.hero{background:linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca);color:#e0e7ff;border-radius:16px;padding:28px}
.hero h1{color:#fff;font-size:26px}
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
@media(max-width:700px){.stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat-strip div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.stat-strip b{display:block;font-size:20px;color:#fff}
.journey{display:flex;flex-direction:column}
.journey .card-b{flex:1}
.who{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.diagram{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center;text-align:center;font-size:13px}
.node{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);font-weight:600}
.node small{display:block;font-weight:400;color:var(--muted)}

/* subscriber app */
.sub-wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;justify-content:center;padding:28px;max-width:1100px;margin:0 auto}
@media(max-width:900px){.sub-wrap{grid-template-columns:1fr;padding:16px}}
.phone{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 50px rgba(15,23,42,.12);overflow:hidden;display:flex;flex-direction:column;min-height:720px}
.phone-top{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:22px 20px 18px}
.phone-top .hi{opacity:.8;font-size:13px}
.phone-body{padding:18px;flex:1;display:flex;flex-direction:column;gap:14px;background:#fafafa}
.phone-nav{display:flex;border-top:1px solid var(--line);background:#fff}
.phone-nav button{flex:1;background:none;border:0;padding:12px 4px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
.phone-nav button.on{color:#6d28d9;box-shadow:inset 0 2px 0 #6d28d9}
.plan{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.plan.on{border-color:#6d28d9;background:#faf5ff}
.plan .price{margin-left:auto;text-align:right;font-weight:700;font-size:18px;white-space:nowrap}
.plan .price small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.otp{display:flex;gap:8px}
.otp input{width:44px;height:50px;text-align:center;font-size:20px;font-weight:700;border:1px solid #d1d5db;border-radius:10px}

/* email */
.mail-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 56px)}
@media(max-width:800px){.mail-wrap{grid-template-columns:1fr}}
.mail-list{background:#fff;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 56px)}
.mail-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:12px 16px;cursor:pointer}
.mail-item:hover{background:var(--surface-2)}
.mail-item.on{background:var(--accent-soft)}
.mail-item b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item span{font-size:12px;color:var(--muted)}
.email{max-width:620px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.email-head{padding:14px 20px;border-bottom:1px solid var(--line-2);font-size:13px;background:var(--surface-2)}
.email-brand{background:#312e81;color:#fff;padding:18px 24px;font-weight:700}
.email-body{padding:22px 24px}
.email-body h2{margin-bottom:10px}
.email-body table td{padding:6px 0;border:0;font-size:13.5px}
.email-body table td:first-child{color:var(--muted);width:46%}
.email-foot{padding:14px 24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2)}
/* Reach Central home (Nu Mobile) */
.home{--home-ink:#1f1f1f;--home-green:#0d5a3a;--home-line:#e3e3e3;--home-panel:#fafafa;--home-icon:#f1f1f1;background:#fff;color:var(--home-ink);font-family:Figtree,Inter,system-ui,sans-serif;min-height:calc(100vh - 56px);display:flex;flex-direction:column}
.home-head{display:flex;align-items:center;gap:16px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative;z-index:1}
.nu-logo{display:flex;align-items:center;gap:12px;padding-left:12px}
.nu-logo span{font-size:19px;letter-spacing:.14em;color:#8a8a8a;font-weight:500}
.home-user{margin-left:auto;font-size:14px;line-height:1.45;padding-right:40px;min-width:0;overflow-wrap:anywhere}
.home-user b{font-weight:500;font-size:16px;display:block}
.home-user .caret{font-size:10px;margin-left:8px}
.home-hero{position:relative;width:100%;max-width:1660px;margin:0 auto;aspect-ratio:1659/576;background:#eef3f6 center/cover no-repeat;background-image:var(--hero);container-type:inline-size}
.home-hero h1{position:absolute;left:12.6%;top:32.5%;margin:0;font-family:Figtree,Inter,system-ui,sans-serif;font-weight:400;color:var(--home-green);font-size:2.9cqw;line-height:1.2;white-space:nowrap}
.home-search{position:absolute;left:17.2%;top:61.2%;width:60.4%;height:9.9%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dcdcdc;border-radius:5px;padding:0 1.2cqw;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.home-search svg{flex:none;width:max(14px,1.1cqw);height:max(14px,1.1cqw);color:#8a8a8a}
.home-search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;font-family:inherit;font-size:max(13px,1cqw);color:var(--home-ink)}
.home-search input::placeholder{color:#3a3a3a}
.home-search:focus-within{border-color:#2f6fe4;box-shadow:0 0 0 3px rgba(47,111,228,.15)}
.home-body{width:100%;max-width:1492px;margin:40px auto 0;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px;flex:1}
.acc{background:var(--home-panel);border-radius:4px}
.acc-h{display:flex;align-items:center;width:100%;background:none;border:0;padding:20px 18px;font-family:inherit;font-size:18px;font-weight:600;color:var(--home-ink);cursor:pointer;text-align:left}
.acc-h .tri{margin-left:auto;font-size:10px;padding-right:12px}
.acc-h:focus-visible{outline:2px solid #2f6fe4;outline-offset:-2px}
.acc-b{display:flex;flex-wrap:wrap;gap:18px;padding:4px 12px 26px}
.tile{position:relative;width:280px;max-width:100%;height:168px;background:#fff;border:1px solid var(--home-line);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;font-family:inherit;font-size:18px;color:#333;transition:box-shadow .15s,border-color .15s}
.tile:hover{border-color:#c9d7f5;box-shadow:0 4px 14px rgba(47,111,228,.10)}
.tile:focus-visible{outline:2px solid #2f6fe4;outline-offset:2px}
.tile .ic{width:92px;height:92px;border-radius:50%;background:var(--home-icon);display:grid;place-items:center}
.tile .ic svg{width:42px;height:42px}
.tile .new{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;letter-spacing:.04em;color:#0d5a3a;background:#e3f5ec;border-radius:999px;padding:2px 8px}
.home-ver{font-size:12px;color:#555;padding:0 0 18px 22px;font-family:system-ui,sans-serif}
@media(max-width:640px){.home-user{padding-right:0;font-size:12px}.home-user b{font-size:14px}.nu-logo{padding-left:0}.nu-logo span{font-size:15px}.tile{width:100%}.acc-b{padding-inline:12px}
  .home-hero{aspect-ratio:auto;padding:calc(100vw * 345 / 1659 + 18px) max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));background-color:#fff;background-image:linear-gradient(#fff,#fff),var(--hero);background-size:100% calc(100% - 100vw * 345 / 1659),100% auto;background-position:bottom,top;background-repeat:no-repeat}
  .home-hero h1{position:static;font-size:26px;white-space:normal}
  .home-search{position:static;width:100%;height:46px;margin-top:14px;padding:0 12px}
  .home-search input{font-size:15px}.home-search svg{width:16px;height:16px}}

.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}
.no{color:#cbd5e1}
</style>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
/* ===================================================================
   Enterprise Offering – end-to-end prototype
   Personas: Brand (Reach Central), Enterprise (Enterprise Central),
   Subscriber (self-care app), Email outbox.
   State lives in memory and is cached in localStorage.
   =================================================================== */
const TODAY = new Date('2026-11-12T10:00:00');
const BRAND_USER = 'brand.ops@demobrand.com';

const ent = id => S.ents.find(e => e.id === id);

const plan = code => S.plans.find(p => p.code === code);
const pName = code => code ? planName(S.plans, code) : '—';
const pPrice = code => planPrice(S.plans, code);
const empsOf = id => S.emps.filter(e => e.entId === id);
const assocOf = id => S.accts.filter(a => a.entId === id && a.type === 'ASSOCIATE');
const empCost = e => pPrice(e.plan) + e.vas.reduce((s, v) => s + pPrice(v), 0);

function arBalance(e) {
  const dn = S.debitNotes.filter(x => x.entId === e.id).reduce((s, x) => s + x.amount, 0);
  const pay = S.payments.filter(x => x.entId === e.id && x.status === 'Verified' && !x.seeded).reduce((s, x) => s + x.amount, 0);
  return Math.round((e.opening + dn - pay) * 100) / 100;
}
const unpaidCount = e => S.summaries.filter(s => s.entId === e.id && s.paid < s.amount - 0.005).length;
function recalcStatus(e) {
  if (!['Active','Hold'].includes(e.status)) return;
  // BRD: Hold if (AR balance + credit) > credit limit. Credit is treated as an offset owed to the enterprise.
  const exposure = arBalance(e) - e.credit;
  const prev = e.status;
  e.status = exposure > e.creditLimit ? 'Hold' : 'Active';
  if (prev !== e.status) audit(e, 'Account status', prev, e.status, 'system');
}
function audit(e, field, oldV, newV, by) {
  e.audit.unshift({ts: nowTs(), field, old: String(oldV ?? ''), new: String(newV ?? ''), by});
}
function nid(kind, prefix) { return prefix + (S.seq[kind]++); }

function toast(msg, mailId) {

function render() {
  const a = document.activeElement, id = a && a.id;
  let ss, se; try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) {}
  const u = U();
  const unseen = S.mails.length - u.mailSeen;
  const tab = (p, label, dot) => `<button class="ptab ${u.persona === p ? 'on' : ''}" data-act="persona" data-p="${p}">${label}${dot ? `<span class="dot">${dot}</span>` : ''}</button>`;
  const pendingPay = S.payments.filter(p => p.status === 'Pending verification').length;
  let body = '';
  if (u.persona === 'home') body = renderHome();
  else if (u.persona === 'guide') body = renderGuide();
  else if (u.persona === 'brand') body = renderBrand();
  else if (u.persona === 'ec') body = renderEC();
  else if (u.persona === 'sub') body = renderSub();
  else if (u.persona === 'mail') body = renderMail();
  $('#app').innerHTML = `
    <header class="top">
      <div class="logo"><i></i>Enterprise offering</div>
      <nav class="ptabs">
        ${tab('home', 'Reach Central home')}
        ${tab('guide', 'Prototype guide')}
        ${tab('brand', 'Reach Central · Brand', pendingPay || '')}
        ${tab('ec', 'Enterprise Central')}
        ${tab('sub', 'Subscriber app')}
        ${tab('mail', 'Email outbox', unseen > 0 ? unseen : '')}
      </nav>
      <span class="spacer"></span>
      <button class="reset" data-act="reset">Reset demo data</button>
    </header>${body}`;
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch (e) {} } }
  save();

let heroClean = null; // hero photo with the welcome text from the source screenshot painted out
function cleanHero() {
  if (heroClean) return;
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      const x0 = 196, x1 = 648, y0 = 180, y1 = 256;
      const L = g.getImageData(x0, y0, 1, y1 - y0).data, R = g.getImageData(x1, y0, 1, y1 - y0).data;
      const out = g.getImageData(x0, y0, x1 - x0, y1 - y0);
      for (let y = 0; y < y1 - y0; y++) for (let x = 0; x < x1 - x0; x++) {
        const t = x / (x1 - x0 - 1), i = (y * (x1 - x0) + x) * 4;
        for (let k = 0; k < 3; k++) out.data[i + k] = L[y * 4 + k] * (1 - t) + R[y * 4 + k] * t;
        out.data[i + 3] = 255;
      }
      g.putImageData(out, x0, y0);
      heroClean = c.toDataURL('image/jpeg', 0.85);
    } catch (e) { heroClean = HERO_SRC; }
    const h = document.querySelector('.home-hero'); if (h) h.style.setProperty('--hero', `url(${heroClean})`);
  };
  img.src = HERO_SRC;
}

function diffFor(x, newCode) {
  const rem = Math.max(0, daysBetween(TODAY, nextMrc(x.mrcAnchor)));
  const unused = Math.round(pPrice(x.plan) * rem / 30 * 100) / 100;
  const charge = pPrice(newCode) + x.vas.reduce((s, v) => s + pPrice(v), 0);
  return {rem, unused, charge, net: Math.round((charge - unused - x.vas.reduce((s, v) => s + pPrice(v) * rem / 30, 0)) * 100) / 100};
}
function planPreview() {
  const f = $('#planForm'); if (!f) return;
  const ids = f.elements.ids.value.split(','), code = f.elements.plan.value, when = f.elements.when.value;
  const xs = ids.map(emp);
  if (when === 'next') { $('#planPrev').innerHTML = `<div class="banner info small"><div>The plan changes on each employee's next MRC${xs.length === 1 ? ` (<b>${fmtD(nextMrc(xs[0].mrcAnchor))}</b>)` : ''}, and that MRC is billed at ${money(pPrice(code))}. Employees get an email with the new plan and activation date.</div></div>`; return; }
  const diffs = xs.map(x => diffFor(x, code));
  const tot = diffs.reduce((s, x) => s + x.net, 0);
  $('#planPrev').innerHTML = `<div class="card card-b small"><b>Differential amount</b>
    ${xs.length === 1 ? `<dl class="kv" style="margin-top:8px"><dt>Unused days on current cycle</dt><dd>${diffs[0].rem} of 30</dd><dt>Credit for unused ${pName(xs[0].plan)}</dt><dd>−${money(diffs[0].unused)}</dd><dt>New cycle charge (plan + VAS)</dt><dd>${money(diffs[0].charge)}</dd></dl>` : ''}
    <div class="row" style="margin-top:8px"><span>Net debit note to enterprise</span><span class="spacer"></span><b>${money(tot)}</b></div>
    <div class="muted" style="margin-top:6px">MRC date resets to ${fmtD(TODAY)} and a new billing summary is generated.</div></div>`;
}

function createEmployee(e, v, quiet) {
  const id = nid('emp', 'EA-');
  let mid = v.mid;
  if (mid) { const m = S.mids.find(m => m.mid === mid); m.status = 'Assigned'; m.empId = id; m.since = iso(TODAY); }
  else { do { mid = '55520' + String(Math.floor(10000 + Math.random() * 89999)); } while (S.mids.some(m => m.mid === mid)); S.mids.push({mid, entId:e.id, empId:id, status:'Assigned', since:iso(TODAY)}); }
  const x = {id, entId:e.id, name:v.name || v.email.split('@')[0], empId:v.empId, email:v.email, dept:v.dept || '—', desig:v.desig || '—', sim:v.sim || 'ESIM', mid, plan:v.plan || e.defaultPlan, vas:v.vas || [],
    noAsso: v.noAsso === '' || v.noAsso == null ? 3 : +v.noAsso, related:[], status:'Active', activated:iso(TODAY), mrcAnchor:iso(TODAY), pendingPlan:null, extType:null, accType:'EMPLOYEE', paymentMethod:'CORPORATE'};
  S.emps.push(x);
  const amt = empCost(x), inv = 'INV-' + (S.seq.inv++);
  S.debitNotes.push({id:nid('dn', 'DN-'), entId:e.id, empId:id, date:iso(TODAY), amount:amt, desc:'MRC · ' + pName(x.plan), invoice:inv, billed:false});
  sendMail('mrc', x.email, 'Your billing summary', {invoice:inv, plan:pName(x.plan), amount:amt, entName:e.brandName});
  sendMail('empActivation', x.email, `Your ${e.brandName} work line is active`, {entName:e.brandName, acct:id, empId:x.empId, mid, plan:pName(x.plan), vas:x.vas.map(pName).join(', '), sim:x.sim});
  if (!quiet) audit(e, 'Employee created', '', `${x.empId} · ${x.name}`, curCtx().who);
  recalcStatus(e);
  return x;
}
function deactivateEmp(x, date) {
  const e = ent(x.entId), who = curCtx().who;
  if (date) { x.status = 'Scheduled deactivation'; x.scheduledOn = date; audit(e, `${x.empId} · status`, 'Active', `Scheduled deactivation (${date})`, who);
    sendMail('deactivation', x.email, 'Your work line is scheduled for deactivation', {entName:e.brandName, scheduled:true, date}); return; }
  const prev = x.status; x.status = 'Deactivated'; x.deactivatedOn = iso(TODAY); x.scheduledOn = null; x.pendingPlan = null;
  const m = S.mids.find(m => m.mid === x.mid); if (m) { m.status = 'Deactivated'; m.empId = null; m.since = iso(TODAY); }
  audit(e, `${x.empId} · status`, prev, 'Deactivated', who);
  sendMail('deactivation', x.email, 'Your work line has been deactivated', {entName:e.brandName});
  x.related.slice().forEach(aid => delinkAccount(acct(aid), true, null));
}
function delinkAccount(a, byEnt, chosen) {
  const e = ent(a.entId), em = emp(a.empRef);
  const low = S.plans.filter(p => !p.ent && p.kind === 'base').sort((x, y) => x.price - y.price)[0];
  const code = chosen || low.code;
  if (em) em.related = em.related.filter(id => id !== a.id);

    if (!OTP) return;
    if (Date.now() > OTP.expires) { OTP.err = 'This code has expired. Send a new one.'; render(); return; }
    if (code !== OTP.code) { OTP.err = 'That code isn\'t right. Check it and try again.'; render(); return; }
    const a = acct(OTP.acct), x = emp(OTP.empId);
    OTP = null; clearInterval(otpTimer);
    const m = linkAccount(a, x, true);
    U().subPage = 'associate'; U().subPick = null;
    render(); toast(`Linked to ${ent(x.entId).brandName}. Pick a discounted plan.`, m.id);
  },
  checkout: fd => {
    const num = (fd.get('num') || '').replace(/\s/g, ''), exp = fd.get('exp') || '', cvc = fd.get('cvc') || '';
    if (!/^\d{15,16}$/.test(num) || !/^\d{2}\/\d{2}$/.test(exp) || !/^\d{3,4}$/.test(cvc)) { toast('Check the card details'); return; }
    if (!fd.get('autopay')) { toast('Save the card for autopay to continue'); return; }
    const a = acct(U().subAcct), p = U().subPick;
    a.card = 'Visa •••• ' + num.slice(-4);
    if (a.isNew || !a.plan) { a.plan = p; a.activated = iso(TODAY); a.status = 'Active'; a.isNew = false; } else a.pendingPlan = p;
    U().subPick = null; U().subPage = 'home'; render(); toast(`Payment complete. ${pName(p)} is ${a.pendingPlan ? 'scheduled' : 'active'} and autopay is on.`);
  },
  subDelink: fd => { const a = acct(U().subAcct); const m = delinkAccount(a, false, fd.get('plan')); closeModal(); U().subPage = 'home'; render(); toast('You\'ve unlinked. Your new plan starts at your next renewal.', m.id); },
};

/* ------------------------------ change / input ------------------------------ */
const C = {
  ecEnt: t => { U().ecEnt = t.value; U().ecUser = ent(t.value).users[0].email; U().sel = []; U().f = {}; render(); },
  ecUser: t => { U().ecUser = t.value; render(); toast(`Now viewing as ${ctxFor(curEntForCtx(), 'enterprise').role}`); },
  f: t => { U().f[t.dataset.k] = t.value; render(); },
  custType: t => { U().custType = t.value; render(); },
  sel: t => { const s = new Set(U().sel); t.checked ? s.add(t.dataset.id) : s.delete(t.dataset.id); U().sel = [...s]; render(); },
  selAll: t => { U().sel = t.checked ? filteredEmps(curEntForCtx()).map(x => x.id) : []; render(); },
  defaultPlan: t => { const e = ent(t.dataset.id); audit(e, 'Default base plan', pName(e.defaultPlan), pName(t.value), curCtx().who); e.defaultPlan = t.value; render(); toast('Default base plan updated'); },
  userRole: t => { const e = ent(t.dataset.id), x = e.users[+t.dataset.i]; audit(e, `Role · ${x.email}`, x.role, t.value, curCtx().who); x.role = t.value; render(); toast(`${x.email} is now ${t.value}`); },
  subAcct: t => { U().subAcct = t.value; U().subPage = 'home'; U().subPick = null; U().linkErr = null; OTP = null; render(); },
  planPreview: () => planPreview(),
  bulkFile: t => { const file = t.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => bulkPreview(ent(t.dataset.id), String(r.result)); r.readAsText(file); },
};
const I = {
  fq: t => { U().f.q = t.value; render(); },
  custQ: t => { U().custQ = t.value; render(); },
  homeQ: t => { U().homeQ = t.value; render(); },
  otpDigit: t => { t.value = t.value.replace(/\D/g, '').slice(0, 1); const n = +t.id.slice(3); if (t.value && n < 5) $('#otp' + (n + 1)).focus(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'INPUT') return;
  e.preventDefault(); fn(t.dataset, t, e);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && C[t.dataset.chg]) C[t.dataset.chg](t, e); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if (t && I[t.dataset.inp]) I[t.dataset.inp](t, e); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); F[f.dataset.form](new FormData(f), f); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
  if (e.key === 'Enter' && e.target.matches('[role=button][data-act]')) e.target.click();
  if (e.key === 'Backspace' && e.target.id?.startsWith('otp') && !e.target.value) { const n = +e.target.id.slice(3); if (n > 0) $('#otp' + (n - 1)).focus(); }
});
document.addEventListener('paste', e => {
  if (!e.target.id?.startsWith('otp')) return;
  const v = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!v) return;
  e.preventDefault(); [...v].forEach((c, i) => { const el = $('#otp' + i); if (el) el.value = c; });
});

render();
</script>
